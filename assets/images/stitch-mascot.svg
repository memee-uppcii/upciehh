<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="stitchBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="stitchBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="stitchEarPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="stitchGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#stitchGlow)">
    <!-- Left Big Ear -->
    <path d="M120 140 C80 120 20 60 10 30 C5 20 15 20 30 25 C70 40 100 80 125 115 Z" fill="url(#stitchBlue)"/>
    <!-- Left Ear Inner Pink -->
    <path d="M115 130 C80 110 35 60 25 35 C35 45 65 75 110 110 Z" fill="url(#stitchEarPink)"/>
    <!-- Left Ear Notch -->
    <polygon points="18,30 25,40 12,38" fill="#F0F9FF"/>

    <!-- Right Big Ear -->
    <path d="M180 140 C220 120 280 60 290 30 C295 20 285 20 270 25 C230 40 200 80 175 115 Z" fill="url(#stitchBlue)"/>
    <!-- Right Ear Inner Pink -->
    <path d="M185 130 C220 110 265 60 275 35 C265 45 235 75 190 110 Z" fill="url(#stitchEarPink)"/>
    <!-- Right Ear Notch -->
    <polygon points="282,30 275,40 288,38" fill="#F0F9FF"/>

    <!-- Body -->
    <ellipse cx="150" cy="220" rx="60" ry="55" fill="url(#stitchBlue)"/>
    <!-- Light Blue Belly -->
    <ellipse cx="150" cy="225" rx="38" ry="38" fill="url(#stitchBelly)"/>

    <!-- Feet/Paws sitting -->
    <!-- Left Foot -->
    <ellipse cx="95" cy="255" rx="26" ry="18" fill="url(#stitchBlue)"/>
    <ellipse cx="95" cy="255" rx="16" ry="11" fill="url(#stitchBelly)"/>
    <!-- Right Foot -->
    <ellipse cx="205" cy="255" rx="26" ry="18" fill="url(#stitchBlue)"/>
    <ellipse cx="205" cy="255" rx="16" ry="11" fill="url(#stitchBelly)"/>
    <!-- Claws -->
    <circle cx="82" cy="252" r="2.5" fill="#0C4A6E"/>
    <circle cx="92" cy="247" r="2.5" fill="#0C4A6E"/>
    <circle cx="102" cy="248" r="2.5" fill="#0C4A6E"/>
    <circle cx="198" cy="248" r="2.5" fill="#0C4A6E"/>
    <circle cx="208" cy="247" r="2.5" fill="#0C4A6E"/>
    <circle cx="218" cy="252" r="2.5" fill="#0C4A6E"/>

    <!-- Head -->
    <ellipse cx="150" cy="140" rx="65" ry="52" fill="url(#stitchBlue)"/>
    <!-- Head Tufts / Hair -->
    <path d="M142 90 C146 78 154 78 158 90 Z" fill="url(#stitchBlue)"/>
    <path d="M136 92 C138 82 144 83 146 93 Z" fill="url(#stitchBlue)"/>

    <!-- Eye Patches (Lighter blue around eyes) -->
    <ellipse cx="120" cy="135" rx="24" ry="26" fill="#7DD3FC" opacity="0.6"/>
    <ellipse cx="180" cy="135" rx="24" ry="26" fill="#7DD3FC" opacity="0.6"/>

    <!-- Big Eyes -->
    <ellipse cx="120" cy="135" rx="16" ry="19" fill="#0F172A"/>
    <ellipse cx="180" cy="135" rx="16" ry="19" fill="#0F172A"/>
    <!-- Eye Highlights (Kawaii sparkle) -->
    <circle cx="124" cy="128" r="6" fill="#FFFFFF"/>
    <circle cx="115" cy="142" r="2.5" fill="#FFFFFF"/>
    <circle cx="184" cy="128" r="6" fill="#FFFFFF"/>
    <circle cx="175" cy="142" r="2.5" fill="#FFFFFF"/>

    <!-- Wide Blue Nose -->
    <ellipse cx="150" cy="150" rx="18" ry="12" fill="#0369A1"/>
    <!-- Nostrils -->
    <ellipse cx="144" cy="152" rx="3" ry="2" fill="#0C4A6E"/>
    <ellipse cx="156" cy="152" rx="3" ry="2" fill="#0C4A6E"/>
    <ellipse cx="150" cy="147" rx="5" ry="2" fill="#38BDF8" opacity="0.6"/>

    <!-- Big Happy Grin -->
    <path d="M110 162 C130 195 170 195 190 162" stroke="#0C4A6E" stroke-width="4" stroke-linecap="round" fill="#881337"/>
    <!-- Tongue -->
    <path d="M136 178 C144 172 156 172 164 178 C158 190 142 190 136 178 Z" fill="#F472B6"/>
    <!-- Tiny sharp teeth -->
    <polygon points="120,165 125,172 130,165" fill="#FFFFFF"/>
    <polygon points="170,165 175,172 180,165" fill="#FFFFFF"/>

    <!-- Little Paws / Hands on tummy -->
    <ellipse cx="125" cy="205" rx="12" ry="16" fill="url(#stitchBlue)" transform="rotate(20 125 205)"/>
    <ellipse cx="175" cy="205" rx="12" ry="16" fill="url(#stitchBlue)" transform="rotate(-20 175 205)"/>

    <!-- Hibiscus Flower on ear -->
    <g transform="translate(182, 85) scale(0.7)">
      <circle cx="20" cy="20" r="10" fill="#F59E0B"/>
      <ellipse cx="20" cy="5" rx="8" ry="12" fill="#FB7185"/>
      <ellipse cx="33" cy="13" rx="8" ry="12" fill="#F43F5E" transform="rotate(72 33 13)"/>
      <ellipse cx="28" cy="30" rx="8" ry="12" fill="#FB7185" transform="rotate(144 28 30)"/>
      <ellipse cx="12" cy="30" rx="8" ry="12" fill="#F43F5E" transform="rotate(216 12 30)"/>
      <ellipse cx="7" cy="13" rx="8" ry="12" fill="#FB7185" transform="rotate(288 7 13)"/>
      <circle cx="20" cy="20" r="5" fill="#FEF08A"/>
    </g>
  </g>
</svg>
