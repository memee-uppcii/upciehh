<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Ocean Wave Base -->
  <path d="M0 80 Q30 50 60 70 T120 70 T180 65 T200 80 L200 120 L0 120 Z" fill="url(#waveGrad)"/>
  <path d="M0 90 Q40 70 80 85 T160 80 T200 90 L200 120 L0 120 Z" fill="#0369A1" opacity="0.6"/>
  <path d="M20 72 Q40 60 70 75" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Stitch Peeking over wave -->
  <!-- Left Ear -->
  <path d="M70 45 C45 35 15 15 10 5 C5 2 12 2 20 4 C40 10 60 30 72 40 Z" fill="#0284C7"/>
  <path d="M68 40 C45 30 22 15 17 8 C25 12 45 25 70 36 Z" fill="#F472B6"/>

  <!-- Right Ear -->
  <path d="M130 45 C155 35 185 15 190 5 C195 2 188 2 180 4 C160 10 140 30 128 40 Z" fill="#0284C7"/>
  <path d="M132 40 C155 30 178 15 183 8 C175 12 155 25 130 36 Z" fill="#F472B6"/>

  <!-- Head -->
  <ellipse cx="100" cy="50" rx="35" ry="28" fill="#0284C7"/>
  <ellipse cx="85" cy="48" rx="12" ry="14" fill="#7DD3FC" opacity="0.6"/>
  <ellipse cx="115" cy="48" rx="12" ry="14" fill="#7DD3FC" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="48" rx="8" ry="10" fill="#0F172A"/>
  <ellipse cx="115" cy="48" rx="8" ry="10" fill="#0F172A"/>
  <circle cx="87" cy="44" r="3" fill="#FFFFFF"/>
  <circle cx="117" cy="44" r="3" fill="#FFFFFF"/>

  <!-- Nose -->
  <ellipse cx="100" cy="55" rx="9" ry="6" fill="#0369A1"/>
  <!-- Smile -->
  <path d="M86 62 Q100 74 114 62" stroke="#0C4A6E" stroke-width="2.5" stroke-linecap="round" fill="#881337"/>
  <!-- Tongue -->
  <path d="M94 67 Q100 64 106 67" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Little paws clutching wave -->
  <ellipse cx="75" cy="72" rx="7" ry="5" fill="#0284C7"/>
  <ellipse cx="125" cy="72" rx="7" ry="5" fill="#0284C7"/>
</svg>
