<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="profBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="profShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Ambient light blobs -->
  <circle cx="150" cy="180" r="130" fill="#E0F2FE" opacity="0.6"/>
  <circle cx="450" cy="300" r="140" fill="#F0FDFA" opacity="0.7"/>

  <!-- Main Canvas Board -->
  <g filter="url(#profShadow)">
    <rect x="80" y="80" width="440" height="340" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="80" y="80" width="440" height="48" rx="20" fill="#F8FAFC"/>
    <line x1="80" y1="128" x2="520" y2="128" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="110" cy="104" r="6" fill="#3B82F6"/>
    <text x="125" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Pilar Nilai &amp; Visi Kerja</text>

    <!-- Card 1: Visi -->
    <rect x="110" y="150" width="180" height="110" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="135" cy="175" r="14" fill="#3B82F6"/>
    <path d="M135 167 L139 175 L143 175 L140 178 L141 183 L135 180 L129 183 L130 178 L127 175 L131 175 Z" fill="#FFFFFF"/>
    <text x="157" y="179" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Visi Inovatif</text>
    <text x="125" y="208" font-family="Inter, sans-serif" font-size="9.5" fill="#3B82F6">Menciptakan karya digital</text>
    <text x="125" y="222" font-family="Inter, sans-serif" font-size="9.5" fill="#3B82F6">yang berdaya guna dan</text>
    <text x="125" y="236" font-family="Inter, sans-serif" font-size="9.5" fill="#3B82F6">mudah diakses siapapun.</text>

    <!-- Card 2: Misi -->
    <rect x="310" y="150" width="180" height="110" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
    <circle cx="335" cy="175" r="14" fill="#0D9488"/>
    <path d="M331 175 L334 178 L340 172" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="357" y="179" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#134E4A">Kualitas Prima</text>
    <text x="325" y="208" font-family="Inter, sans-serif" font-size="9.5" fill="#0F766E">Performa website optimal,</text>
    <text x="325" y="222" font-family="Inter, sans-serif" font-size="9.5" fill="#0F766E">kode rapi dan bersih,</text>
    <text x="325" y="236" font-family="Inter, sans-serif" font-size="9.5" fill="#0F766E">serta responsif di layar.</text>

    <!-- Progress / Skills Bar -->
    <rect x="110" y="280" width="380" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="130" y="306" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#334155">Standar Kualitas &amp; Integrasi</text>
    
    <!-- Item 1 -->
    <text x="130" y="332" font-family="Inter, sans-serif" font-size="10" fill="#475569">UI/UX Light &amp; Clean Design</text>
    <rect x="290" y="324" width="180" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="290" y="324" width="170" height="8" rx="4" fill="#3B82F6"/>

    <!-- Item 2 -->
    <text x="130" y="354" font-family="Inter, sans-serif" font-size="10" fill="#475569">Optimasi Vercel &amp; Cloud</text>
    <rect x="290" y="346" width="180" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="290" y="346" width="175" height="8" rx="4" fill="#10B981"/>

    <!-- Item 3 -->
    <text x="130" y="376" font-family="Inter, sans-serif" font-size="10" fill="#475569">Struktur Kode Standar Industri</text>
    <rect x="290" y="368" width="180" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="290" y="368" width="165" height="8" rx="4" fill="#6366F1"/>
  </g>

  <!-- Small floating decorative element -->
  <g filter="url(#profShadow)">
    <circle cx="500" cy="110" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="500" cy="110" r="16" fill="#F59E0B"/>
    <path d="M496 110 L499 113 L505 107" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
